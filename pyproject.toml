[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insightweaver"
version = "0.1.0"
description = "Transform RSS feed data streams into coherent, actionable narratives"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "InsightWeaver Team"}
]
keywords = ["rss", "feed", "aggregator", "ai", "narrative", "synthesis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # 1.x: output_config is a named parameter and messages.parse() exists,
    # which Tier 2's structured output needs (2026-09-22, backlog task 026).
    "anthropic>=1.7,<2",
    "feedparser>=6.0.11",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12.3",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0",
    "click>=8.0.0",
    # Credentials live in the OS keychain (src/config/credentials.py).
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
    "pip-tools>=7.4.1",
    # Secret scanning, in pre-commit and CI (2026-09-22, backlog task 026).
    "detect-secrets>=1.5.0",
    # `make typecheck` needs the PyYAML stubs; pre-commit already installed them
    # for its own mypy hook, so the gate passed there and failed in a plain venv.
    "types-PyYAML",
]

[project.scripts]
insightweaver = "src.cli.app:cli"

[project.urls]
Homepage = "https://github.com/sam-aydlette/InsightWeaver"
Repository = "https://github.com/sam-aydlette/InsightWeaver"
Issues = "https://github.com/sam-aydlette/InsightWeaver/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "W191",   # indentation contains tabs
    "B904",   # raise without from inside except
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*.py" = ["ARG", "S101"]  # Allow unused args and asserts in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = false
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "src.database.models",
    "src.database.connection",
]
ignore_errors = true

# Updated 2026-08-31 (backlog task 012). `src.context.*`, `src.pipeline.*` and
# `src.prompts.*` were deleted; `src.forecast.*` had not existed for some time.
# `src.matching.*` and `src.llm.*` are the new homes of the five modules ported
# out of `src.context`, and they inherit the suppression those files already had
# rather than gaining a new one -- the annotations here are SQLAlchemy Column
# descriptors mypy reads as their column type, which predates this task.
[[tool.mypy.overrides]]
module = [
    "src.rss.*",
    "src.matching.*",
    "src.llm.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "src.cli.*",
    "src.utils.*",
    "src.config.*",
]
ignore_errors = true
